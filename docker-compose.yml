version: "3.8"
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - MODEL_PATH=models/best_model.pkl
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
    volumes:
      - ./mlruns:/mlflow/mlruns
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin